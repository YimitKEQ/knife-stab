<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knife Stab · Levitate</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #0e0d0a;
  --panel: #17150f;
  --fg: #efeadc;
  --muted: #8e8775;
  --rule: #2a2720;
  --gold: #edc200;
  --hit: #ff5a3c;
  --display: "Urbanist", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--display); }
main { max-width: 1280px; margin: 0 auto; padding: 36px 20px 56px; display: grid; gap: 22px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 24px; }
h1 { margin: 0; font-weight: 800; font-size: clamp(30px, 5vw, 52px); line-height: 1; letter-spacing: -0.01em; }
h1 span { color: var(--gold); }
.by { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stage { position: relative; border-radius: 6px; overflow: hidden; background: #000; }
.stage video { display: block; width: 100%; height: auto; aspect-ratio: 1920 / 720; }
.tag { position: absolute; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: #fff; background: rgba(0,0,0,.45); padding: 3px 7px; border-radius: 3px; pointer-events: none; }
.t1 { left: 1%; top: 2.5%; } .t2 { left: 67.6%; top: 2.5%; } .t3 { left: 67.6%; top: 52.5%; }
.fr { position: absolute; left: 1%; bottom: 3%; font-family: var(--mono); font-size: 14px; color: #fff; background: rgba(0,0,0,.55); padding: 4px 9px; border-radius: 3px; font-variant-numeric: tabular-nums; pointer-events: none; }
.fr.hit { background: var(--hit); }
.track { position: relative; display: flex; height: 34px; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; background: var(--panel); cursor: pointer; touch-action: none; }
.seg { display: flex; align-items: center; padding: 0 8px; min-width: 0; overflow: hidden; white-space: nowrap; font-family: var(--mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-right: 1px solid var(--rule); }
.seg:last-of-type { border-right: 0; }
.seg.hot { color: var(--fg); background: rgba(237, 194, 0, .14); }
.mark { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--hit); pointer-events: none; }
.head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--gold); pointer-events: none; }
.scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 6px; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font-family: var(--mono); font-size: 13px; padding: 7px 13px; border-radius: 4px; border: 1px solid var(--rule); background: var(--panel); color: var(--fg); cursor: pointer; }
button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
button:focus-visible, .track:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.sp { flex: 1; }
.specs { display: flex; flex-wrap: wrap; gap: 8px 26px; font-family: var(--mono); font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 16px; }
.specs b { color: var(--fg); font-weight: 600; }
@media (max-width: 640px) { .seg { font-size: 0; padding: 0; } .tag { font-size: 8px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Knife <span>Stab</span></h1>
    <div class="by">Arma Reforger · by Levitate</div>
  </header>

  <div class="stage">
    <video id="v" src="stab.mp4" poster="poster.jpg" autoplay muted loop playsinline preload="auto"></video>
    <span class="tag t1">1ST PERSON</span>
    <span class="tag t2">3RD PERSON</span>
    <span class="tag t3">3RD PERSON · FRONT</span>
    <span class="fr" id="fr">f00 / 50</span>
  </div>

  <div>
    <div class="track" id="track" tabindex="0" role="slider" aria-label="Scrub frames" aria-valuemin="0" aria-valuemax="50">
      <div class="seg" style="flex:7">guard</div>
      <div class="seg hot" style="flex:6">strike</div>
      <div class="seg" style="flex:7">bite</div>
      <div class="seg hot" style="flex:6">rip out</div>
      <div class="seg" style="flex:24">recover</div>
      <div class="mark" style="left:calc(26% - 1px)"></div>
      <div class="head" id="head"></div>
    </div>
    <div class="scale"><span>f0</span><span>contact f13</span><span>f50</span></div>
  </div>

  <div class="ctl">
    <button type="button" data-rate="1" aria-pressed="true">1x</button>
    <button type="button" data-rate="0.5" aria-pressed="false">0.5x</button>
    <button type="button" data-rate="0.25" aria-pressed="false">0.25x</button>
    <button type="button" id="pp">Pause</button>
    <button type="button" id="prev">◀ frame</button>
    <button type="button" id="next">frame ▶</button>
    <span class="sp"></span>
  </div>

  <div class="specs">
    <span>skeleton <b>vanilla Reforger, 157 bones</b></span>
    <span>length <b>51 frames · 30 fps · 1.7 s</b></span>
    <span>contact <b>frame 13</b></span>
    <span>knife <b>RightHandProp, keyed</b></span>
    <span>bodies <b>male + female</b></span>
  </div>
</main>
<script>
const FPS = 30, END = 50, HIT = 13;
const v = document.getElementById("v"), fr = document.getElementById("fr"), head = document.getElementById("head"), track = document.getElementById("track"), pp = document.getElementById("pp");
const rateBtns = [...document.querySelectorAll("[data-rate]")];
const frame = () => Math.min(END, Math.floor(v.currentTime * FPS + 1e-3));
function paint() {
  const f = frame();
  fr.textContent = `f${String(f).padStart(2, "0")} / ${END}`;
  fr.classList.toggle("hit", f === HIT);
  head.style.left = `calc(${(f / END) * 100}% - 1px)`;
  track.setAttribute("aria-valuenow", String(f));
}
const loop = () => { paint(); requestAnimationFrame(loop); };
requestAnimationFrame(loop);
v.addEventListener("seeked", paint);
v.addEventListener("timeupdate", paint);
const play = () => { v.play().catch(() => {}); pp.textContent = "Pause"; };
const stop = () => { v.pause(); pp.textContent = "Play"; };
rateBtns.forEach(b => b.onclick = () => {
  v.playbackRate = Number(b.dataset.rate);
  rateBtns.forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  play();
});
pp.onclick = () => (v.paused ? play() : stop());
const goto = f => { stop(); v.currentTime = (Math.min(END, Math.max(0, f)) + 0.5) / FPS; };
document.getElementById("prev").onclick = () => goto(frame() - 1);
document.getElementById("next").onclick = () => goto(frame() + 1);
const seek = e => { const r = track.getBoundingClientRect(); goto(Math.round(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * END)); };
track.addEventListener("pointerdown", e => { seek(e); track.setPointerCapture(e.pointerId); });
track.addEventListener("pointermove", e => { if (e.buttons) seek(e); });
track.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") { goto(frame() - 1); e.preventDefault(); }
  if (e.key === "ArrowRight") { goto(frame() + 1); e.preventDefault(); }
});
paint();
</script>
</body>
</html>
